[package]
name = "modppl-derender"
version = "0.1.0"
edition = "2021"

[features]
# gated: realsense-rust links against the librealsense2 native SDK, which
# most machines (including every tutorial-only attendee) don't have
# installed. Without this feature, `cargo build --examples` and the tutorial
# series build/run with zero native dependencies beyond a C compiler and
# windowing headers (see README's Setup section).
realsense = ["dep:realsense-rust"]

[dependencies]
modppl = { version = "0.3.1", default-features = false, features = ["f32"] }
# for 64 byte floating point precision
# modppl = { version = "0.3.1" }  
float_extras = "0.1.6"
glam = "0.28.0"
rayon = "1.10.0"
realsense-rust = { version = "1.3.0", optional = true }
anyhow = "1.0.86"
minifb = "0.28.0"

# only compiled/linked with `--features realsense`
[[bin]]
name = "live_rgbd_cube"
path = "src/bin/live_rgbd_cube.rs"
required-features = ["realsense"]
