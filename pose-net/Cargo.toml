[package]
name = "pose-net"
version = "0.1.0"
edition = "2021"

[features]
cuda = ["candle-core/cuda"]
# forwards to modppl-derender's realsense feature -- see that crate's
# Cargo.toml for why this is opt-in (avoids requiring librealsense2 for
# anyone not running live_cnn against a real camera).
realsense = ["modppl-derender/realsense"]

[dependencies]
# note: the "cudnn" feature was tried and measured *slower* than candle's
# plain CUDA convs on this stack (RTX 3070 Ti laptop, candle 0.8) -- don't
# re-enable without re-measuring.
candle-core = "0.8"
candle-nn = "0.8"
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
modppl = { version = "0.3.1", default-features = false, features = ["f32"] }
modppl-derender = { path = "../derender" }
minifb = "0.28.0"

[[bin]]
name = "train"
path = "src/train.rs"

[[bin]]
name = "infer"
path = "src/infer.rs"

[[bin]]
name = "live_cnn"
path = "src/bin/live_cnn.rs"
required-features = ["realsense"]

[[bin]]
name = "synth_cnn"
path = "src/bin/synth_cnn.rs"

[[bin]]
name = "graphviz"
path = "src/bin/graphviz.rs"
